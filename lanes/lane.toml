# Контракт дорожки для этого проекта.
#
# Секция [image]: общий lanes/runner:1 (node/bun/chromium) не несёт Rust-тулчейн, нужный этому
# воркспейсу. Свой образ на базе rust:1-bookworm вместо этого:
# mingw-w64 (кросс-компиляция приложения под x86_64-pc-windows-gnu — его единственную платформу;
# сервер oracle-web собирается под Linux этим же тулчейном) плюс
# компоненты rustfmt/clippy для CI-гейта (шаг 9 архитектурного плана). Более ранняя ревизия этого
# файла упоминала Xvfb + Mesa lavapipe для Linux/X11-спайка; тот спайк и его платформенный модуль
# удалены тем же днём — приложение целится только в Windows, второй платформенный бэкенд не
# поддерживается.
#
# Нет [install]: у Cargo нет отдельного шага установки зависимостей — они тянутся при первом
# `cargo build`/`cargo run --example`.

[image]
ref = "build:lanes/runner.Dockerfile"

# Dev-сервер — oracle-web, сервис oracle.pushka.biz, прямо из чекаута: сайт, руководство и API в
# продовой раскладке, без токенов GitHub и Telegram (сухой прогон). `lane dev up` — и
# http://<laneHost> открывается с любой машины в локальной сети; после правки сервера или
# docs/guide — `lane dev restart`. Первый старт идёт минуты (клон git-зависимости GPUI и
# release-сборка): у dev-пода только readiness-проба, она под не перезапускает. Подробности — в
# lanes/dev.sh.
[dev]
cmd = ["bash", "lanes/dev.sh"]
health = "/healthz"

# Кэши — тома узла, которые монтирует runner каждой дорожки (herdr-lanes, manifests/runner.yaml):
# один экземпляр на все ворктри, а не копия в каждом.
#
# Домашний каталог Cargo — /var/cache/lanes/cargo: реестр и клон git-зависимости GPUI качаются
# один раз на узел, а не в .tmp/ каждого нового ворктри (там это около 4 минут сети и 1,7 ГБ
# записи на SSD). Неиспользуемое из него Cargo удаляет сам (пакеты, которых не трогали от месяца
# до трёх).
#
# sccache (бинарь — в lanes/runner.Dockerfile) складывает в /var/cache/lanes/sccache результаты
# rustc и вызовов C-компилятора из build-скриптов (крейт cc шлёт их через RUSTC_WRAPPER), и
# холодная сборка нового ворктри берёт готовое у прежних. В ключ входят пути исходников крейта,
# рабочий каталог rustc и CARGO_HOME, поэтому домашний каталог Cargo у всех дорожек обязан быть
# один и тот же: с .tmp/cargo-home у второго ворктри не совпал ни один ключ (замер 12.11.2026,
# sccache 0.19.0, `cargo test --workspace --exclude poe2-oracle --no-run`: 0 попаданий из 664; с
# общим каталогом 628, из них Rust 188 из 224). Не совпадают крейты проекта (у каждого ворктри
# свой путь чекаута) и те, чей rustc читает OUT_DIR из target/ ворктри: serde, serde_core и всё,
# что от них зависит. Путь sccache 0.19.0 для Rust не отбрасывает: SCCACHE_BASEDIRS для Rust
# вошёл в main 02.11.2026, а в релиз не попал. Инкрементальную сборку sccache не кэширует,
# поэтому CARGO_INCREMENTAL = "0" (то же, что incremental = false в Cargo.toml, но и для
# release). Предел размера кэша каждый сервер sccache считает для себя.
#
# Dev-под этих томов не получает (он монтирует один чекаут): lanes/dev.sh берёт свой CARGO_HOME в
# .tmp/cargo-home и запускает rustc без sccache. Сборки (target/, .tmp/lane-dev/target) и старый
# мусор .tmp/ раз в сутки подметает lanes/tidy.py (таймер poe2-oracle-tidy на хосте).
[env]
CARGO_HOME = "/var/cache/lanes/cargo"
RUSTC_WRAPPER = "sccache"
SCCACHE_DIR = "/var/cache/lanes/sccache"
SCCACHE_CACHE_SIZE = "10G"
CARGO_INCREMENTAL = "0"
