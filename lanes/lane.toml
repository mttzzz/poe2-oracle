# Контракт дорожки для этого проекта.
#
# Секция [image]: общий lanes/runner:1 (node/bun/chromium) не несёт Rust-тулчейн, нужный этому
# воркспейсу. Свой образ на базе rust:1-bookworm вместо этого:
# mingw-w64 (кросс-компиляция приложения под x86_64-pc-windows-gnu — его единственную платформу;
# сервер oracle-web собирается под Linux этим же тулчейном) плюс
# компоненты rustfmt/clippy для CI-гейта (шаг 9 архитектурного плана). Более ранняя ревизия этого
# файла упоминала Xvfb + Mesa lavapipe для Linux/X11-спайка; тот спайк и его платформенный модуль
# удалены тем же днём — приложение целится только в Windows, второй платформенный бэкенд не
# поддерживается.
#
# Нет [install]: у Cargo нет отдельного шага установки зависимостей — они тянутся при первом
# `cargo build`/`cargo run --example`.

[image]
ref = "build:lanes/runner.Dockerfile"

# Dev-сервер — oracle-web, сервис oracle.pushka.biz, прямо из чекаута: сайт, руководство и API в
# продовой раскладке, без токенов GitHub и Telegram (сухой прогон). `lane dev up` — и
# http://<laneHost> открывается с любой машины в локальной сети; после правки сервера или
# docs/guide — `lane dev restart`. Первый старт идёт минуты (клон git-зависимости GPUI и
# release-сборка): у dev-пода только readiness-проба, она под не перезапускает. Подробности — в
# lanes/dev.sh.
[dev]
cmd = ["bash", "lanes/dev.sh"]
health = "/healthz"
