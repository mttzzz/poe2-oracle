# Windows cross-compilation (x86_64-pc-windows-gnu) from this project's Linux lane runner.
# mingw-w64's cross gcc doubles as the linker driver cargo/rustc need for this target.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# The native Windows build (the release exe, built on Windows) carries the C runtime inside it:
# linked dynamically, the exe needs VCRUNTIME140.dll, which comes with the Visual C++
# Redistributable, not with Windows -- a machine without it can't start the app at all.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
