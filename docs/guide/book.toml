[book]
title = "PoE2 Oracle"
description = "Player guide for PoE2 Oracle, a price-check overlay for Path of Exile 2 on Windows. English and Russian."
authors = ["PoE2 Oracle contributors"]
language = "en"
src = "src"

[build]
# A page listed in SUMMARY.md but missing on disk fails the build instead of being created empty.
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
no-section-label = true
# Where the book is published: https://oracle.pushka.biz/guide/
site-url = "/guide/"
additional-css = ["theme/guide.css"]
additional-js = ["theme/guide.js"]

# Off: stock mdBook's search can't find Russian words -- its index and its query trimmer drop
# Cyrillic -- and half of this book is Russian. The sidebar lists every page instead.
[output.html.search]
enable = false
