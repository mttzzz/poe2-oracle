# The player guide is a book per language, English in src/en and Russian in src/ru, and this is
# what they share. build.sh builds both and sets what differs per language through mdBook's
# MDBOOK_ variables: book.src, book.language, book.description and output.html.site-url.
[book]
title = "PoE2 Oracle"
authors = ["PoE2 Oracle contributors"]

[build]
# A page listed in SUMMARY.md but missing on disk fails the build instead of being created empty.
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
no-section-label = true
additional-css = ["theme/guide.css"]
additional-js = ["theme/guide.js"]

# Off in both books: stock mdBook's search can't find Russian words -- its index and its query
# trimmer drop Cyrillic -- and the English book alone having one would make the two books differ.
# The sidebar lists every page instead.
[output.html.search]
enable = false
