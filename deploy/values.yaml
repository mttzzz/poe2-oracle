# Deploy values for the app chart (helm upgrade -f, from .github/workflows/deploy.yml); the chart's
# values.schema.json checks them at render.
app:
  name: oracle-pushka-biz
  subdomain: oracle
  domain: pushka.biz
  # oracle-web's default PORT.
  port: 8080
  replicas: 1
  # GITHUB_TOKEN, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID and REDIS_URL come from the Secret
  # oracle-pushka-biz-env-secret, which the Infisical operator keeps in sync with the
  # oracle-pushka-biz project (infisical/infisical-secret.yaml).
  useSecret: true
  # User namespaces: root in the container isn't root on the node. The pod is stateless.
  hostUsers: false
  probePath: /healthz
  # The server answers within milliseconds of starting: a new pod takes traffic after its first
  # probe, a second in.
  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 5
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    # The latest releases' files stay in memory (up to 40 MiB) to serve downloads, a report's body
    # can be 12 MiB (three at once), and each open event stream takes about 23 KiB (the service
    # holds at most 4000: crates/oracle-web/src/events.rs).
    memory: 256Mi
    cpu: 250m
env:
  PUBLIC_URL: https://oracle.pushka.biz
  # The releases and their downloads come from the app's repository. The reports go as issues to a
  # private repository of their own: they hold what players wrote, their contacts and the texts of
  # their items and crashes, and the app's repository may be public.
  GITHUB_REPO: mttzzz/poe2-oracle
  GITHUB_REPORTS_REPO: mttzzz/poe2-oracle-reports
  RUST_LOG: info
httpRoute:
  enabled: true
  # Only the https listener: on :80 the gateway's catch-all redirect sends everyone to https.
  sectionName: https-pushka-biz-wildcard
  # The gateway gives a client 600 s to send a whole request (ClientTrafficPolicy default-policy,
  # requestReceivedTimeout), so a 12 MiB report needs about 20 KB/s. A route's timeout runs from the
  # end of the request to the end of the answer.
  extraRules:
    # A report: its 600 s cover forwarding the diagnostics zip to Telegram and opening the issue,
    # and stay 600 s even if the gateway's default (BackendTrafficPolicy default-backend-policy)
    # is lowered.
    - matches:
        - path:
            type: Exact
            value: /api/v1/reports
      timeouts:
        request: 600s
    # Release files, installers and data packs, stream to the player at the player's pace, which
    # the default 600 s would cut on a slow line; 0s turns the route timeout off.
    - matches:
        - path:
            type: PathPrefix
            value: /download
      timeouts:
        request: 0s
    # The app's event stream stays open while the app runs. 0s turns off the route timeout and the
    # route's idle timeout with it (Envoy Gateway v1.8: a route whose request timeout is 0 gets
    # idle_timeout 0, unless a ClientTrafficPolicy sets a stream idle timeout). The service writes
    # `: ping` every 25 s, inside every idle timeout that could still apply: a stream idle timeout
    # (Envoy's default is 5 min), Envoy's connection idle timeouts (1 h, for connections without an
    # open stream) and the DigitalOcean load balancer's 600 s (kuber:
    # helmfile/manifests/gateway/envoy-proxy-config.yaml).
    - matches:
        - path:
            type: Exact
            value: /api/v1/events
      timeouts:
        request: 0s
