[package]
name = "release-sign"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Few dependencies on purpose: .github/workflows/release.yml builds this tool on a fresh runner and
# then hands it the release key, so everything compiled here runs next to that key.
[dependencies]
# The release key: Ed25519, checked with `verify_strict` like crates/auto-update checks it.
ed25519-dalek = "2"
# Seeds, public keys and signatures travel as standard base64 text (oracle-protocol's
# SUMS_SIGNATURE_ASSET).
base64 = "0.22"
# The seed `keygen` draws from the operating system's random source.
getrandom = "0.3"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
