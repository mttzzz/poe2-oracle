[package]
name = "poe-dat"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# .dat64 tables live inside bundle files; poe-bundle is how this crate gets their raw bytes (used
# by this crate's read_table convenience wrapper -- parse_table itself is pure, byte-in/rows-out).
poe-bundle = { path = "../poe-bundle" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Synchronous HTTP client for fetching poe-tool-dev/dat-schema's schema-poe2.min.json -- a CLI
# tool doing a handful of blocking requests doesn't need reqwest+tokio's async runtime weight
# (data-pipeline has no other async need either; see the crate doc comment).
ureq = "2"
# Platform-correct cache directory (resolves to ~/.cache/poe2-oracle on Linux) for the fetched
# schema, so repeated data-pipeline runs don't re-fetch it every time.
directories = "5"
