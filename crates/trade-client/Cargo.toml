[package]
name = "trade-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# `ParsedItem` and the stat catalog's shapes. The trade API's own request/response structs stay
# local to this crate.
poe2-domain = { path = "../poe2-domain" }
# The `HttpClient` trait + `AsyncBody`/`Json` this crate's functions are written against --
# *not* `reqwest_client` (the concrete implementation): the caller constructs and injects the
# real client (crates/poe2-oracle's `app.rs`), keeping this crate UI/runtime-agnostic.
http_client = { git = "https://github.com/zed-industries/zed", rev = "b54cc1d0acc8fe3f7581721ee1195516e7581f9d" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Warnings (stale cache fallbacks, an exchange source out of reach) and the rate-limit audit trail
# (`checked_body`) go through the `log` facade: the app's logger writes them into its log file,
# where a release build's detached stderr would lose them.
log = "0.4"
# `SearchFilter` -- the shape `search_with_filters` (step 7) builds a stat-filtered trade search
# request body from.
stat-filters = { path = "../stat-filters" }
