[package]
name = "poe-bundle"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Bundle files are Oodle-compressed; decompression is the one thing this crate needs from below
# it in the local game-data chain (oodle-ffi <- poe-bundle <- poe-dat <- data-pipeline).
oodle-ffi = { path = "../oodle-ffi" }
anyhow = "1"

[features]
# Gates the tests/live_share.rs integration test, which needs the real Bundles2 SMB share (see
# the workspace root architecture plan's step 1) and a real Oodle DLL -- neither available in
# default `cargo test --workspace` CI runs. Enable explicitly: `cargo test -p poe-bundle
# --features live-share`, with POE2_BUNDLES2_ROOT/ODLE_TEST_DLL_PATH set.
live-share = []
