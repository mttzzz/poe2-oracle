[package]
name = "oodle-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Cross-platform dynamic-library loading (dlopen on Linux, LoadLibrary on Windows). Mainstream,
# actively-maintained crate -- not a PoE-specific dependency. Works on Linux too (this crate's
# own crate compiles and its unit test *builds* everywhere), but actually loading a real Windows
# PE .dll only succeeds when run on Windows -- see the ODLE_TEST_DLL_PATH-gated test below.
libloading = "0.8"
anyhow = "1"
