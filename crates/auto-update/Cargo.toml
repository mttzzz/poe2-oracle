[package]
name = "auto-update"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The `HttpClient` trait the app's GPUI client (reqwest_client) implements -- injected by the
# caller, same as trade-client, so this crate stays runtime-agnostic and testable with a canned
# client.
http_client = { git = "https://github.com/zed-industries/zed", rev = "b54cc1d0acc8fe3f7581721ee1195516e7581f9d" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Release tags are `vX.Y.Z`; compared by semver precedence against the running version.
semver = "1"
# The installer is verified against the release's SHA256SUMS before it is ever started.
sha2 = "0.10"
# Where the service is, and the release answer it gives.
oracle-protocol = { path = "../oracle-protocol" }
# SHA256SUMS counts only with the release key's Ed25519 signature (SHA256SUMS.sig, standard
# base64), checked with `verify_strict` like crates/release-sign checks it.
ed25519-dalek = "2"
base64 = "0.22"
# The event stream (src/events.rs): the channels the app hears it on, the kind its GPUI side
# already uses (2.5 for `Sender::closed`); its waits -- the backoff, the silent-connection
# watchdog -- on whatever executor runs it, through one helper thread and no runtime; the backoff's
# jitter (already in the tree through GPUI's executor); and why a connection dropped, in the app's
# log.
async-channel = "2.5"
futures-timer = "3"
fastrand = "2"
log = "0.4"

[features]
# The app's own tests only (crates/poe2-oracle's dev-dependency): `test_support`, a release signed
# with a key of the tests' own and the download that trusts it. Nothing the app ships turns it on.
test-support = []

[dev-dependencies]
parking_lot = "0.12"
tempfile = "3"
