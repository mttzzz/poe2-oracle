[package]
name = "auto-update"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The `HttpClient` trait the app's GPUI client (reqwest_client) implements -- injected by the
# caller, same as trade-client, so this crate stays runtime-agnostic and testable with a canned
# client.
http_client = { git = "https://github.com/zed-industries/zed", rev = "b54cc1d0acc8fe3f7581721ee1195516e7581f9d" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Release tags are `vX.Y.Z`; compared by semver precedence against the running version.
semver = "1"
# The installer is verified against the release's SHA256SUMS before it is ever started.
sha2 = "0.10"

[dev-dependencies]
parking_lot = "0.12"
tempfile = "3"
