[package]
name = "poe2-oracle"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Pinned to a git rev, not the crates.io 0.2.2 release: that release predates the gpui_platform
# split and the Windows backend described on the live main-branch README (confirmed by reading
# the source at this exact commit before writing any code against it, per plan step 3).
# Re-pin to current zed-industries/zed main if this commit ever fails to build; GPUI is pre-1.0
# with frequent breaking changes, and a build break here is not itself a GPUI verdict.
gpui = { git = "https://github.com/zed-industries/zed", rev = "b54cc1d0acc8fe3f7581721ee1195516e7581f9d" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b54cc1d0acc8fe3f7581721ee1195516e7581f9d" }
# Zed's own GPUI-integrated HTTP client wrapper around reqwest (see crates/zed/src/main.rs) --
# reused instead of hand-wiring raw reqwest+tokio against GPUI's own executor.
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "b54cc1d0acc8fe3f7581721ee1195516e7581f9d" }
# Not on crates.io (publish = false, internal workspace crate) but reachable as a git dependency:
# supplies the `HttpClient` trait, `AsyncBody`/`Json`, and `Response` that `reqwest_client`
# implements against and that `App::http_client()` returns.
http_client = { git = "https://github.com/zed-industries/zed", rev = "b54cc1d0acc8fe3f7581721ee1195516e7581f9d" }
# Deliberately NOT depending on `arboard`: GPUI already exposes `App::read_from_clipboard()`
# natively on every platform (backed by the native Win32 clipboard on Windows internally), so a
# second clipboard client would just race the first one for clipboard ownership.
global-hotkey = "0.8"
# Same major version pinned in Zed's own workspace; `gpui::Window` implements `HasWindowHandle`
# from this exact crate, so the version must stay compatible for the raw handle match to
# type-check. `std` feature requested explicitly: `HandleError`'s `impl std::error::Error` is
# gated behind it (raw-window-handle's own `src/lib.rs`), and it happens to get unified on by
# some other Linux-only dependency but not on the `x86_64-pc-windows-gnu` target -- without it,
# `.context()` on `Result<WindowHandle, HandleError>` fails with an unsatisfied-trait-bounds
# error on Windows only, while the identical Linux code compiles fine.
raw-window-handle = { version = "0.6", features = ["std"] }
anyhow = "1"
# Cache directory for the stat/currency catalog (`price_check.rs`'s bootstrap): same
# `ProjectDirs::from("", "", "poe2-oracle")` convention already established in `trade-client`'s
# own `cache.rs` doc comment -- that crate's `load_or_fetch` takes an explicit path rather than
# constructing one itself, so the one real call site (here) needs this dependency.
directories = "5"
# The player's settings file (src/settings.rs): `Settings` round-trips through JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The workspace's own libraries: shared item types, clipboard item parsing, the search filters,
# the trade API client and the update check. None has Windows-only code, so they build and test
# on Linux too.
poe2-domain = { path = "../poe2-domain" }
item-parser = { path = "../item-parser" }
trade-client = { path = "../trade-client" }
stat-filters = { path = "../stat-filters" }
auto-update = { path = "../auto-update" }
# Everything the app reports goes through `log`'s macros (GPUI/gpui_wgpu's own device-lost/
# surface/adapter-fallback warnings too), and `env_logger` writes it to the log file
# (src/logging.rs) -- and to stderr when one is attached, so `RUST_LOG=debug` still surfaces
# real diagnostics in a console.
log = "0.4"
env_logger = "0.11"
# Query values of the GitHub issue form URLs a bug report opens (src/bug_report.rs). Already in
# the tree through `url`.
percent-encoding = "2"
# Carries hotkey presses, tray-menu clicks, consumed Esc presses and foreground-window changes
# from the OS callbacks that report them to the GPUI tasks that act on them, so nothing polls --
# and what the live search threads hear to the task that fetches it (src/live_search.rs, which
# builds and is tested on every target). Already in the tree through GPUI's executor (smol).
async-channel = "2"
# Live search (src/live_search.rs): the trade site's websocket, one blocking socket per watched
# search on a thread of its own. TLS through the rustls 0.23 already in the tree (reqwest's), with
# the system's root certificates -- no second TLS stack. Its config is built with an explicit
# crypto provider, aws-lc-rs (the one Zed's `http_client_tls` picks): the tree enables both of
# rustls' providers, and `ClientConfig::builder()` then refuses to choose.
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-native-certs = "0.8"
# The locks around the pathofexile.com session (src/session.rs) and live search's per-socket stop
# signal (src/live_search.rs): no poisoning to unwrap. Already in the tree through GPUI.
parking_lot = "0.12"
# The `AsyncRead` the app's HTTP client wraps each answer's body in (src/session.rs), so that
# reqwest's read timeout can start its timer while GPUI's executors read. Already in the tree
# through http_client.
futures = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# The diagnostics report is one zip the player attaches to a bug report (src/diagnostics.rs).
# Deflate through flate2, already in the tree; none of zip's other codecs.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# Same major version gpui/gpui_windows pin in Zed's own workspace at this commit. Only the raw
# Win32 APIs needed for src/platform/win32.rs (SetWindowLongPtrW/SetWindowPos and friends), the
# `poe2_production_Config.ini` `[ACTION_KEYS]` reader (src/platform/game_config.rs, no raw
# Win32 API surface -- plain file I/O -- but grouped with the rest of the Windows-only platform
# layer), and SendInput-based synthetic key combos (src/platform/synth_input.rs, needs
# `Win32_UI_Input_KeyboardAndMouse` for `SendInput`/`INPUT`/`KEYBDINPUT`/`VIRTUAL_KEY`) -- not
# talking to any gpui_windows type directly, just a HWND reconstructed from the
# raw-window-handle isize, so exact-version lockstep with gpui's internal `windows` isn't
# required for correctness, only for keeping one coherent toolchain in the repo.
# Plus `Win32_Graphics_Dwm` (removing the Windows 11 frame around the overlay), `Win32_Graphics_Gdi`
# + `Win32_UI_HiDpi` (game-window/monitor geometry and DPI scale for EE2's panel placement --
# src/platform/game_window.rs, and the process DPI-awareness opt-in in src/app.rs),
# `Win32_System_LibraryLoader` (module handle for the Esc low-level keyboard hook,
# src/platform/esc_hook.rs).
# `Win32_System_Registry` (the per-user `Run` value behind "start with Windows",
# src/platform/autostart.rs, and the Windows version in the diagnostics report).
# `Win32_System_Threading` (the game process's image path, beside which its `logs\Client.txt`
# lives -- src/platform/client_log.rs).
# `Win32_UI_Accessibility` (the WinEvent hook that reports foreground-window changes,
# src/platform/game_window.rs).
# `Win32_System_Console` (whether a stderr is attached, src/logging.rs) and
# `Win32_System_SystemInformation` (the local time the diagnostics report is named by).
# `Win32_Security_Credentials` (the player's pathofexile.com session, kept in the Windows
# Credential Manager -- src/platform/credentials.rs).
# `Win32_System_Time` (the hours an exchange price comes from, on the player's clock --
# src/ui/panel/market.rs).
# `Win32_Globalization` (the Windows display language, which «Авто» interface language follows
# before the game's first run -- src/i18n.rs).
# `Win32_System_DataExchange`, `Win32_System_Memory` and `Win32_System_Ole` (the clipboard formats
# GPUI doesn't write or read: the privacy marks on a quick action's text, and those of what the
# player copied -- src/platform/clipboard_poll.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# Notification-area icon with a Quit item: the overlay is a `WindowKind::PopUp` (no taskbar
# button by design), so without it the running app is invisible and can only be killed from Task
# Manager -- EE2 ships the same tray entry for the same reason. Same tauri-apps family as
# `global-hotkey`, driven by the same GPUI main-thread message loop. Default features are
# Linux-only (libxdo/appindicator), so they're off.
tray-icon = { version = "0.25", default-features = false }
# The sign-in window (src/platform/login_window.rs): pathofexile.com's login page in Microsoft Edge
# WebView2, through Microsoft's WebView2 COM API generated for the same `windows` 0.62. Its
# completion handlers and events run from GPUI's own message loop, so nothing waits for the
# browser -- `wry` would: it waits for the browser's start and for each cookie read in a nested
# message loop of its own. The WebView2 loader is linked statically on MSVC, so the shipped exe
# needs no WebView2Loader.dll; the windows-gnu type-check build imports that DLL instead.
webview2-com = "0.39"

[build-dependencies]
# build.rs embeds the app icon and VERSIONINFO into the exe: rc.exe on MSVC, mingw's windres on the
# Linux lane's windows-gnu cross builds, nothing for other targets. The crate and major version
# gpui's own build script already uses for its manifest resource, so nothing new gets built.
embed-resource = "3.0"
