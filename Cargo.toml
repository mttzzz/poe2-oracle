[workspace]
# Edition 2024 crates default to dependency-resolver v3 only when inferred from a root package's
# own edition; this is a *virtual* manifest (no root [package]), so resolver must be set
# explicitly or Cargo silently falls back to the legacy v1 resolver for the whole workspace.
resolver = "3"
members = [
    "crates/poe2-domain",
    "crates/item-parser",
    "crates/trade-client",
    "crates/stat-filters",
    "crates/auto-update",
    "crates/poe2-oracle",
    "crates/oracle-protocol",
    "crates/oracle-data",
    "crates/oracle-web",
    "crates/release-sign",
    "crates/item-synth",
]

[workspace.package]
# The app's version (the exe's VERSIONINFO, the installer name, the update check's baseline);
# release tags are `v` + this.
version = "0.2.2"
edition = "2024"
publish = false
# Every crate inherits these (`license.workspace = true` and so on). LICENSE-MIT and LICENSE-APACHE
# are the two license texts; the installer ships them next to the exe.
authors = ["mttzzz"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mttzzz/poe2-oracle"
homepage = "https://oracle.pushka.biz/"

# Debug and test builds: line tables for the workspace's own crates (a backtrace still names file
# and line), no debug info for dependencies, no incremental cache. With full debug info and the
# incremental cache one checkout's target/ reached 54 GB by 12.11.2026, the app's test executable
# alone 340 MB a build and its Windows dev exe 626 MB; with these the Linux tests and the Windows
# dev build take 3.6 GB together, and the exe 163 MB. The incremental cache would rebuild the app's
# tests after an edit in 1.3 s instead of 6 s, for 274 MB per kind of build. lanes/tidy.py deletes
# what builds leave behind.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
