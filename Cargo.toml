[workspace]
# Edition 2024 crates default to dependency-resolver v3 only when inferred from a root package's
# own edition; this is a *virtual* manifest (no root [package]), so resolver must be set
# explicitly or Cargo silently falls back to the legacy v1 resolver for the whole workspace.
resolver = "3"
members = [
    "crates/poe2-domain",
    "crates/item-parser",
    "crates/trade-client",
    "crates/stat-filters",
    "crates/auto-update",
    "crates/poe2-oracle",
    "crates/oracle-protocol",
    "crates/oracle-data",
    "crates/oracle-web",
    "crates/release-sign",
]

[workspace.package]
# The app's version (the exe's VERSIONINFO, the installer name, the update check's baseline);
# release tags are `v` + this.
version = "0.1.4"
edition = "2024"
publish = false
# Every crate inherits these (`license.workspace = true` and so on). LICENSE-MIT and LICENSE-APACHE
# are the two license texts; the installer ships them next to the exe.
authors = ["mttzzz"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mttzzz/poe2-oracle"
homepage = "https://oracle.pushka.biz/"
