# The Infisical operator copies the oracle-pushka-biz project's prod secrets (GITHUB_TOKEN,
# TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, REDIS_URL) into the Secret oracle-pushka-biz-env-secret, which
# the pod reads (deploy/values.yaml, useSecret). Applied once by hand:
#   kubectl apply -f infisical/infisical-secret.yaml
# after the machine identity's credentials are in the Secret oracle-pushka-biz-infisical-auth.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: oracle-pushka-biz-prod
  namespace: default
spec:
  hostAPI: http://infisical-backend.default.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 60s
    instantUpdates: false
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: oracle-pushka-biz
        envSlug: prod
        secretsPath: /
        recursive: false
      credentialsRef:
        secretName: oracle-pushka-biz-infisical-auth
        secretNamespace: default
  managedKubeSecretReferences:
    - secretName: oracle-pushka-biz-env-secret
      secretNamespace: default
      creationPolicy: Owner
      secretType: Opaque
