name: Pages

# Publishes https://mttzzz.github.io/poe2-oracle/: the landing pages from site/ (English at the
# root, Russian under ru/; they draw the app's interface with site/ui), the player guide built
# from docs/guide with mdBook under guide/, and the guide's pictures under images/, where the
# landing pages' social previews are. Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.5.4
  # sha256 of mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz, as listed on the release.
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        run: |
          archive="mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/$archive"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the site
        run: |
          mdbook build docs/guide --dest-dir _site/guide
          cp -R site/. _site/
          cp -R docs/guide/src/images _site/images

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
