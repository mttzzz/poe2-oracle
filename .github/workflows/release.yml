name: Release

# Pushing a tag vX.Y.Z builds the Windows installer, signs its SHA256SUMS and creates the tag's
# GitHub release as a DRAFT with the installer, SHA256SUMS and SHA256SUMS.sig: the layout
# crates/auto-update reads (tag vX.Y.Z; assets PoE2-Oracle-Setup-X.Y.Z.exe, SHA256SUMS,
# SHA256SUMS.sig). The owner tests the draft, then publishes it by hand: oracle.pushka.biz hands
# out published releases only. The notes are CHANGELOG.md's section for the version.
# packaging/build-release.ps1 does the building -- the same script used by hand on a Windows
# machine -- and refuses a tag that is not "v" + the workspace version. The installer carries
# LICENSE-MIT, LICENSE-APACHE and the THIRD-PARTY-NOTICES.html the script writes next to the exe,
# so the release attaches nothing else.
#
# Separate jobs, so that nothing the build runs can sign or publish. The build compiles the whole
# dependency graph -- build scripts and proc-macros included -- with a read-only token it doesn't
# keep in the checkout, and no secret. The sign job compiles crates/release-sign alone (two dozen
# small crates) on a fresh runner without caches. The RELEASE_SIGNING_KEY secret reaches two of
# its steps only: a shell check that it is set, before anything is compiled, and release-sign's
# signing; the signature is then checked against the public key the app carries. Only the publish
# job, which runs `gh release create` and nothing else, may write releases. Each job hands its
# output on as an artifact. Actions are pinned to commits, their version in the comment beside
# each.
on:
  push:
    tags: ["v*"]

permissions: {}

# The Rust every job builds with: the lane's (lanes/runner.Dockerfile, rust:1-bookworm), which
# checks the code, on 2026-09-26. Pinned here rather than in a rust-toolchain.toml, which would
# switch the lane, CI and the web service's image too: a release just must not change compilers
# because a runner image moved on. RUSTUP_TOOLCHAIN overrides a runner's default toolchain.
env:
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  # First, and quick: a tag whose version CHANGELOG.md doesn't describe stops before the build.
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      # The section runs from its "## [X.Y.Z]" heading to the next heading of that level or the
      # link list closing the file. A pre-release (X.Y.Z-rc.N) without one of its own takes
      # X.Y.Z's.
      - name: Take the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          section() {
            awk -v heading="## [$1]" '
              index($0, heading) == 1 { found = 1; next }
              found && (/^## / || /^\[[^]]+\]: /) { exit }
              found { print }
            ' CHANGELOG.md
          }
          notes="$(section "$version")"
          if ! grep -q '[^[:space:]]' <<<"$notes"; then notes="$(section "${version%%-*}")"; fi
          if ! grep -q '[^[:space:]]' <<<"$notes"; then
            echo "::error::CHANGELOG.md has no section '## [$version]' to take the release notes from."
            exit 1
          fi
          mkdir notes
          printf '%s\n' "$notes" > notes/RELEASE-NOTES.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes
          if-no-files-found: error

  build:
    needs: notes
    # windows-latest (Windows Server 2025, checked 2026-09-22) ships rustup, the Windows SDK
    # (fxc.exe for gpui's release-mode shaders, rc.exe for the exe's icon and version) and the
    # GitHub CLI. NSIS is not on it; build-release.ps1 fetches its pinned zip. Nor is cargo-about;
    # build-release.ps1 installs its pinned version, which rust-cache keeps (~/.cargo/bin) for the
    # next tag.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before rust-cache, whose key names the compiler.
      - name: Install the pinned Rust
        shell: pwsh
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The app reads POE2_ORACLE_API_BASE at build time: a test service's address must never
      # ship. build-release.ps1 checks it too, and oracle-protocol's test-only feature.
      - name: Refuse a test build's service settings
        shell: pwsh
        run: |
          if (Test-Path Env:POE2_ORACLE_API_BASE) {
            throw 'POE2_ORACLE_API_BASE is set: a release talks to https://oracle.pushka.biz'
          }

      # Unsigned, which the script warns about: this job never sees the key, the sign job signs.
      - name: Build the exe, the installer and SHA256SUMS
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./packaging/build-release.ps1 -Tag $env:TAG

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: target/dist
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check that the release key is there
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is missing: add the release key's seed under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: nothing another run compiled may run where the key is.
      - name: Build release-sign
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo build -p release-sign --release --locked

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: target/release/release-sign sign dist/SHA256SUMS dist/SHA256SUMS.sig

      # A secret holding another key would sign a release every installed copy refuses.
      - name: Check the signature against the key the app carries
        run: |
          if ! target/release/release-sign verify dist/SHA256SUMS dist/SHA256SUMS.sig \
              "$(cat crates/auto-update/release-signing-key.pub)"; then
            echo "::error::RELEASE_SIGNING_KEY is not the release key: its public half isn't crates/auto-update/release-signing-key.pub, so installed apps would refuse this release."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature
          path: dist/SHA256SUMS.sig
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signature
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes

      # A draft stays out of GitHub's "latest release", and so out of the service, until the owner
      # publishes it; every file is attached by then.
      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          $flags = @('--draft', '--verify-tag', '--title', "PoE2 Oracle $version",
            '--notes-file', 'notes/RELEASE-NOTES.md')
          # GitHub's "latest" release never points at a pre-release, so a vX.Y.Z-rc.N reaches
          # only those who install it by hand.
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG "dist/PoE2-Oracle-Setup-$version.exe" dist/SHA256SUMS `
            dist/SHA256SUMS.sig @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
