name: CI

on:
  push:
  pull_request:

# Reads the code and nothing else: the job pushes, publishes and comments nowhere.
permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The hosted runner leaves about 14 GB free, less than the workspace's two debug builds (native
      # and windows-gnu, GPUI included) take: the linker died of it with a bus error on 2026-09-27.
      # SDKs no step here uses go first -- .NET, Android, Haskell, CodeQL, some 30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # The project's own lane runner image (lanes/runner.Dockerfile): rust:1-bookworm plus the
      # mingw-w64 cross toolchain for x86_64-pc-windows-gnu (the app's only target) and the
      # rustfmt/clippy components. Built fresh here rather than pulled from a registry -- only CI
      # and the lane use it, and a from-Dockerfile build is the standard, boring way to use a
      # custom CI environment. The root .dockerignore keeps its build context down to a few files.
      - name: Build runner image
        run: docker build -f lanes/runner.Dockerfile -t poe2-oracle-runner .

      # Cargo's registry/git cache and the target dir live inside the container by default; both
      # are redirected into the checked-out workspace (mounted into the container below) so
      # actions/cache can persist them across runs on the host side.
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci-cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # --user matches the container process's uid/gid to the host runner's, so cargo can write
      # to the bind-mounted workspace/target dirs regardless of the image's own baked-in `runner`
      # user (uid 1000) -- avoids permission mismatches against whatever uid actually owns the
      # actions/checkout'd files here.
      #
      # Ordered fastest/cheapest-to-fail first: a trivial `cargo fmt` miss shouldn't burn CI time
      # on the expensive cross-compile step. Clippy and test both run in two passes because
      # `poe2-oracle`, the app, is mostly Windows-only code (its platform layer, UI and price
      # check are `#[cfg(target_os = "windows")]`): its clippy pass targets windows-gnu, where all
      # of it compiles. `cargo test` runs natively (Linux), not cross-compiled -- GPUI's gpui_linux
      # backend builds and runs directly on this runner, and cross-compiled Windows binaries can't
      # execute here anyway (no Wine) -- so the app's own pass runs the tests of its
      # platform-independent modules (`--lib`). Every other crate -- oracle-protocol, oracle-web
      # and release-sign included -- goes through the native clippy and test passes. oracle-web is
      # the Linux server behind oracle.pushka.biz (the root Dockerfile, deploy.yml), so the
      # windows-gnu build leaves it out.
      #
      # No incremental state and no debug info (CARGO_INCREMENTAL, CARGO_PROFILE_DEV_DEBUG): CI builds
      # each crate once and throws the result away, and without them the debug builds take a
      # fraction of the disk and link faster. A failing test still names its file and line: panic
      # locations don't come from debug info.
      - name: cargo fmt / clippy / test / build (windows-gnu)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/workspace -w /workspace \
            -e CARGO_HOME=/workspace/.ci-cargo-home \
            -e HOME=/workspace/.ci-cargo-home \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_PROFILE_DEV_DEBUG=0 \
            poe2-oracle-runner \
            bash -c '
              set -euo pipefail
              cargo fmt --all -- --check
              cargo clippy --workspace --all-targets --exclude poe2-oracle -- -D warnings
              cargo clippy -p poe2-oracle --all-targets --target x86_64-pc-windows-gnu -- -D warnings
              cargo test --workspace --exclude poe2-oracle
              cargo test -p poe2-oracle --lib
              cargo build --workspace --exclude oracle-web --target x86_64-pc-windows-gnu
            '
