name: Data release

# Pushing a tag data-<N> builds the game data pack from the tagged commit's tables, signs its
# SHA256SUMS and creates the tag's GitHub release as a DRAFT with PoE2-Oracle-Data-<N>.zip,
# SHA256SUMS and SHA256SUMS.sig: the layout crates/auto-update reads for data packs. The owner
# checks the draft, then publishes it by hand, never as the latest release: oracle.pushka.biz
# hands out published packs only, and installed apps then take the pack in place of older
# built-in tables without a new installer. `oracle-data build` (crates/oracle-data) does the
# building and refuses a tag whose <N> isn't the version crates/oracle-data/data-version.txt
# names, and tables that changed since that version was recorded there.
#
# The jobs are release.yml's: the build compiles with a read-only token it doesn't keep in the
# checkout, and no secret. The sign job compiles crates/release-sign alone on a fresh runner
# without caches. The RELEASE_SIGNING_KEY secret reaches two of its steps only: a shell check that
# it is set, before anything is compiled, and release-sign's signing; the signature is then
# checked against the public key the app carries. Only the publish job, which runs
# `gh release create` and nothing else, may write releases. Each job hands its output on as an
# artifact. Actions are pinned to commits, their version in the comment beside each.
on:
  push:
    tags: ["data-*"]

permissions: {}

# The Rust every job builds with: release.yml's, which says why it is pinned.
env:
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pack and SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo run -p oracle-data --release --locked -- build dist --version "${TAG#data-}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check that the release key is there
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is missing: add the release key's seed under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: nothing another run compiled may run where the key is.
      - name: Build release-sign
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo build -p release-sign --release --locked

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: target/release/release-sign sign dist/SHA256SUMS dist/SHA256SUMS.sig

      # A secret holding another key would sign a pack every installed copy refuses.
      - name: Check the signature against the key the app carries
        run: |
          if ! target/release/release-sign verify dist/SHA256SUMS dist/SHA256SUMS.sig \
              "$(cat crates/auto-update/release-signing-key.pub)"; then
            echo "::error::RELEASE_SIGNING_KEY is not the release key: its public half isn't crates/auto-update/release-signing-key.pub, so installed apps would refuse this pack."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature
          path: dist/SHA256SUMS.sig
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signature
          path: dist

      # A draft stays out of the service until the owner publishes it, every file attached by
      # then. Not the latest release: that stays the app's.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#data-}"
          gh release create "$TAG" "dist/PoE2-Oracle-Data-$version.zip" dist/SHA256SUMS \
            dist/SHA256SUMS.sig --draft --verify-tag --latest=false \
            --title "PoE2 Oracle game data $version" \
            --notes "The game tables PoE2 Oracle carries, data version $version. Installed apps take them in place of older built-in tables at their next start, without a new installer."
