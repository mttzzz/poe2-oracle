name: Problem
description: "Something in PoE2 Oracle doesn't work as it should. / Что-то в PoE2 Oracle работает не так, как должно."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Quicker, and private: write from the app.** Settings → **Help** → **Write to the developer**. The report takes the app's version and, if you like, a diagnostics report along, and only the developer reads it. After a crash, the app opens that window by itself. Without the app, use the form at https://oracle.pushka.biz/report.html.

        Everything on this page is **public**: don't post your contacts, passwords or session cookie (`POESESSID`). One problem per issue. If an item is read or priced wrong, pick **Item** instead.

        _Быстрее и закрыто — из программы: «Настройки» → «Помощь» → «Написать разработчику». Без программы — форма https://oracle.pushka.biz/ru/report.html. Всё на этой странице видно всем: не пишите сюда контакты, пароли и cookie сессии. Писать можно по-русски._
  - type: input
    id: version
    attributes:
      label: App version
      description: "Settings → Help → About shows it. / Версия программы: «Настройки» → «Помощь» → «О программе»."
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: game-language
    attributes:
      label: Game client language
      description: "/ Язык клиента игры"
      options:
        - English
        - Russian / Русский
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: "What you did, what you expected and what happened instead. A screenshot helps. / Что вы сделали, чего ожидали и что произошло на самом деле. Скриншот поможет."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be repeated?
      description: "If it happens again and again, the steps that lead to it. / Если это повторяется — шаги, которые к этому приводят."
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report (optional)
      description: "Settings → Help → **Collect report** saves a zip to your desktop, with your Windows user name and folders hidden. Look inside before you attach it here: this page is public. / «Настройки» → «Помощь» → «Собрать отчёт» сохраняет архив на рабочий стол, имя пользователя Windows и папки в нём скрыты. Посмотрите, что внутри, прежде чем прикладывать: эта страница видна всем."
    validations:
      required: false
