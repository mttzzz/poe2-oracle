name: Item problem / Проблема с предметом
description: An item isn't recognised, or the panel shows wrong filters or a wrong price. / Предмет не распознаётся, или на панели неверные фильтры или цена.
labels: ["bug", "item"]
body:
  - type: markdown
    attributes:
      value: |
        For the maintainer's own notes. Players report an item from the app: **report a problem** under the item name on the price panel, or **Report a problem** in the message about an item it couldn't read, sends the item's text with the report. The item's text is what lets us reproduce the problem, so it is required here. Search the existing issues first: the same item may already be reported.

        Для заметок самого сопровождающего. Игроки сообщают о предмете из программы: «сообщить о проблеме» под названием предмета на панели или «Сообщить о проблеме» в сообщении о предмете, который она не смогла прочитать, отправляет текст предмета вместе с сообщением. Без текста предмета проблему не воспроизвести, поэтому здесь он обязателен. Сначала поищите среди существующих задач: о таком предмете, возможно, уже сообщили.
  - type: input
    id: version
    attributes:
      label: Version / Версия
      description: Windows Settings → Apps → Installed apps shows it next to PoE2 Oracle. / Видна в Параметры Windows → Приложения → Установленные приложения, рядом с PoE2 Oracle.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: game-language
    attributes:
      label: Game client language / Язык клиента игры
      placeholder: English client / Russian client / Английский клиент / Русский клиент
    validations:
      required: true
  - type: textarea
    id: item-text
    attributes:
      label: Item text / Текст предмета
      description: Hover the item in the game, press Ctrl+Alt+C and paste the text here. / Наведите курсор на предмет в игре, нажмите Ctrl+Alt+C и вставьте текст сюда.
      render: text
    validations:
      required: true
  - type: textarea
    id: what-wrong
    attributes:
      label: What is wrong? / Что не так?
      description: What the panel showed and what you expected (the right filter, a price you saw on the trade site). A screenshot of the panel helps. / Что показала панель и чего вы ожидали (какой фильтр верный, какую цену вы видели на сайте торговли). Скриншот панели поможет.
    validations:
      required: true
