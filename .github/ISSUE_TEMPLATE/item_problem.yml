name: Item problem / Проблема с предметом
description: An item isn't recognised, or the panel shows wrong filters or a wrong price. / Предмет не распознаётся, или на панели неверные фильтры или цена.
labels: ["bug", "item"]
body:
  - type: markdown
    attributes:
      value: |
        The item's text is what lets us reproduce the problem, so it is required. The app fills it in for you: use «сообщить об ошибке ↗» under the item name on the price panel, or «Сообщить разработчику» in the message about an item it couldn't read. Please search the [existing issues](https://github.com/mttzzz/poe2-oracle/issues?q=is%3Aissue) first: the same item may already be reported.

        Без текста предмета проблему не воспроизвести, поэтому он обязателен. Программа вставит его сама: нажмите «сообщить об ошибке ↗» под названием предмета на панели или «Сообщить разработчику» в сообщении о предмете, который она не смогла прочитать. Сначала поищите среди [существующих задач](https://github.com/mttzzz/poe2-oracle/issues?q=is%3Aissue): о таком предмете, возможно, уже сообщили.
  - type: input
    id: version
    attributes:
      label: Version / Версия
      description: Windows Settings → Apps → Installed apps shows it next to PoE2 Oracle. / Видна в Параметры Windows → Приложения → Установленные приложения, рядом с PoE2 Oracle.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: game-language
    attributes:
      label: Game client language / Язык клиента игры
      placeholder: English client / Русский клиент
    validations:
      required: true
  - type: textarea
    id: item-text
    attributes:
      label: Item text / Текст предмета
      description: Hover the item in the game, press Ctrl+Alt+C and paste the text here. / Наведите курсор на предмет в игре, нажмите Ctrl+Alt+C и вставьте текст сюда.
      render: text
    validations:
      required: true
  - type: textarea
    id: what-wrong
    attributes:
      label: What is wrong? / Что не так?
      description: What the panel showed and what you expected (the right filter, a price you saw on the trade site). A screenshot of the panel helps. / Что показала панель и чего вы ожидали (какой фильтр верный, какую цену вы видели на сайте торговли). Скриншот панели поможет.
    validations:
      required: true
