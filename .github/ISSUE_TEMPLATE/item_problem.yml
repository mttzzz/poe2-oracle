name: Item
description: "An item the app can't read, or reads or prices wrong. / Предмет не читается, или программа читает либо оценивает его неверно."
labels: ["item"]
body:
  - type: markdown
    attributes:
      value: |
        **Quicker, and private: report it from the app.** Click **report a problem** under the item's name on the price panel, or **Report a problem** in the message about an item the app couldn't read. The item's text goes along, and only the developer reads it.

        Everything on this page is **public**: don't post your contacts, passwords or session cookie (`POESESSID`). Search the existing issues first: the same item may already be here.

        _Быстрее и закрыто — из программы: «сообщить о проблеме» под названием предмета на панели цены или «Сообщить о проблеме» в сообщении о предмете, который программа не смогла прочитать. Всё на этой странице видно всем. Писать можно по-русски._
  - type: input
    id: version
    attributes:
      label: App version
      description: "Settings → Help → About shows it. / Версия программы: «Настройки» → «Помощь» → «О программе»."
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: game-language
    attributes:
      label: Game client language
      description: "/ Язык клиента игры"
      options:
        - English
        - Russian / Русский
    validations:
      required: true
  - type: textarea
    id: item-text
    attributes:
      label: Item text
      description: "In the game, point at the item, press Ctrl+Alt+C and paste the text here. / В игре наведите курсор на предмет, нажмите Ctrl+Alt+C и вставьте текст сюда."
      render: text
    validations:
      required: true
  - type: textarea
    id: what-wrong
    attributes:
      label: What is wrong?
      description: "What the panel showed and what you expected: the right filter, or a price you saw on the trade site. A screenshot of the panel helps. / Что показала панель и чего вы ожидали: какой фильтр верный или какую цену вы видели на сайте торговли. Скриншот панели поможет."
    validations:
      required: true
