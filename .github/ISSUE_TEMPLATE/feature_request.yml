name: Feature request / Предложить идею
description: Suggest something PoE2 Oracle could do. / Предложите, что PoE2 Oracle мог бы делать.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For the maintainer's own notes. Players send ideas from the app (**Report a problem or idea…** in its tray menu, kind **Idea**) or through the site's form at https://oracle.pushka.biz/report.html. Search the existing issues first and suggest one idea per issue.

        Для заметок самого сопровождающего. Игроки присылают идеи из программы («Сообщить о проблеме или идее…» в меню значка в трее, вид «Идея») или через форму на сайте https://oracle.pushka.biz/ru/report.html. Сначала поищите среди существующих задач; одна задача — одна идея.
  - type: textarea
    id: need
    attributes:
      label: What do you want to do? / Что вы хотите сделать?
      description: The situation in the game and what gets in the way today. / Ситуация в игре и что сейчас мешает.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could PoE2 Oracle help? / Чем мог бы помочь PoE2 Oracle?
      description: What the app would do or show. A sketch or a screenshot of another tool helps. / Что программа делала бы или показывала. Поможет набросок или скриншот другой программы.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it now? / Как вы делаете это сейчас?
      description: Other tools or workarounds you use. / Другие программы или обходные пути.
    validations:
      required: false
